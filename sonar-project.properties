# SonarQube — Turbine Lens
sonar.projectKey=portfolio---Fleetmind
sonar.projectName=Turbine Lens
sonar.host.url=http://127.0.0.1:9000

# Code source analysé : le serveur Python ET le front React (c'est lui que la
# migration de charte a touché).
sonar.sources=server,client/src

# Exclusions : bundle compilé (build par le conteneur), dépendances, scanner
# téléchargé, dossier de travail Sonar, caches Python, minifiés, venv, scratch.
sonar.exclusions=client/out/**,client/node_modules/**,.scanner/**,.scannerwork/**,**/__pycache__/**,**/*.min.js,.venv/**,htmx_app/**,htmx_app_agents_tmp/**,test_sous_agent/**,data/**

sonar.sourceEncoding=UTF-8

# ------------------------------------------------------------------
# NE PAS mettre le token ici (ce fichier est commité).
# Le passer au lancement, depuis la racine du repo :
#     read -s SONAR_TOKEN && export SONAR_TOKEN && pysonar-scanner
# (l'invite `read -s` évite aussi de laisser le token dans l'historique shell.)
# ------------------------------------------------------------------
